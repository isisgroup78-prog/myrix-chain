[package]
name = "myrix_chain"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = "0.7"
libp2p = { version = "0.53", features = ["tcp", "gossipsub", "identify", "kad"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
