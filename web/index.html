<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MYRIX Chain Explorer</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">MYRIX</div>
        <nav class="nav-links">
          <a href="#">Blocks</a>
          <a href="#">Transactions</a>
          <a href="#">Validators</a>
        </nav>
      </header>

      <main class="main-content">
        <section class="hero">
          <div class="hero-text">
            <h1>MYRIX Chain</h1>
            <p class="subtitle">Mainnet explorer and operational dashboard</p>
          </div>
        </section>

        <section class="stats-section">
          <div class="stat-card">
            <label>Latest Height</label>
            <span class="stat-value" id="block-height">--</span>
          </div>
          <div class="stat-card">
            <label>Validators</label>
            <span class="stat-value" id="validator-count">--</span>
          </div>
          <div class="stat-card">
            <label>Peers</label>
            <span class="stat-value" id="peer-count">--</span>
          </div>
          <div class="stat-card">
            <label>Block Time</label>
            <span class="stat-value" id="block-time">--</span>
          </div>
        </section>

        <section class="panel">
          <h2>Latest block</h2>
          <div class="block-info">
            <div class="info-row"><label>Height</label><span id="latest-height">--</span></div>
            <div class="info-row"><label>Hash</label><span id="latest-hash" class="monospace">--</span></div>
            <div class="info-row"><label>Proposer</label><span id="latest-proposer">--</span></div>
            <div class="info-row"><label>Transactions</label><span id="latest-tx-count">--</span></div>
            <div class="info-row"><label>Gas Used</label><span id="latest-gas-used">--</span></div>
          </div>
        </section>

        <section class="panel">
          <h2>Top validators</h2>
          <div class="validator-list" id="validator-list">
            <p>Loading...</p>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
